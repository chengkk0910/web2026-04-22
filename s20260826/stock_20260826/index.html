<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>股票資料查詢</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons (可選) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .table-container {
      max-height: 70vh;
      overflow-y: auto;
    }
    thead th {
      position: sticky;
      top: 0;
      background-color: #212529 !important;
      color: #fff !important;
      z-index: 1;
    }
  </style>
</head>
<body>

  <header class="bg-dark text-white py-3 mb-4 shadow-sm">
    <div class="container">
      <h1 class="h3 mb-0"><i class="bi bi-graph-up-arrow me-2"></i>股票歷史資料查詢系統</h1>
    </div>
  </header>

  <!-- 1. container-input -->
  <div class="container container-input mb-4" id="container-input">
    <div class="card shadow-sm border-0">
      <div class="card-body">
        <h5 class="card-title mb-3"><i class="bi bi-sliders me-2"></i>條件篩選</h5>
        <form id="stock-form" class="row g-3 align-items-end">
          <div class="col-md-6 col-sm-8">
            <label for="stock-select" class="form-label fw-bold">選擇股票 / ETF 代碼：</label>
            <select class="form-select form-select-lg" id="stock-select" name="stock">
              <option value="0050" selected>0050 (元大台灣50)</option>
              <option value="voo">voo (Vanguard S&P 500 ETF)</option>
              <option value="qqq">qqq (Invesco QQQ Trust)</option>
            </select>
          </div>
          <div class="col-md-3 col-sm-4">
            <button type="submit" class="btn btn-primary btn-lg w-100" id="btn-submit">
              <i class="bi bi-search me-1"></i> 查詢 (Submit)
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- 2. container-output -->
  <div class="container container-output mb-5" id="container-output">
    <div class="card shadow-sm border-0">
      <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
        <h5 class="card-title mb-0">
          <i class="bi bi-table me-2"></i>查詢結果：<span id="current-stock-label" class="text-primary fw-bold">0050</span>
        </h5>
        <span class="badge bg-secondary fs-6" id="data-count-badge">資料筆數：載入中...</span>
      </div>
      <div class="card-body p-0">
        <!-- 載入中狀態 -->
        <div id="loading-spinner" class="text-center py-5">
          <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
            <span class="visually-hidden">載入中...</span>
          </div>
          <p class="mt-3 text-muted">正在載入資料，請稍候...</p>
        </div>

        <!-- 錯誤提示 -->
        <div id="error-alert" class="alert alert-danger m-3 d-none" role="alert">
          <i class="bi bi-exclamation-triangle-fill me-2"></i>
          <span id="error-message">無法載入資料，請確認檔案是否存在。</span>
        </div>

        <!-- 資料表格 -->
        <div class="table-responsive table-container" id="table-wrapper" style="display: none;">
          <table class="table table-striped table-hover table-bordered mb-0 align-middle">
            <thead class="table-dark">
              <tr>
                <th scope="col" class="text-center" style="width: 100px;">資料筆數</th>
                <th scope="col" class="text-center">time</th>
                <th scope="col" class="text-end">open</th>
                <th scope="col" class="text-end">hight</th>
                <th scope="col" class="text-end">low</th>
                <th scope="col" class="text-end">close</th>
              </tr>
            </thead>
            <tbody id="stock-data-tbody">
              <!-- 動態生成資料列 -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- jQuery CDN -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- Bootstrap 5 JS Bundle CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    $(document).ready(function () {
      // 讀取並渲染股票資料的函數
      function loadStockData(stock) {
        var jsonUrl = './data/' + stock + '.json';
        
        // 更新 UI 狀態為載入中
        $('#loading-spinner').show();
        $('#table-wrapper').hide();
        $('#error-alert').addClass('d-none');
        $('#current-stock-label').text(stock.toUpperCase());
        $('#data-count-badge').text('資料筆數：載入中...').removeClass('bg-success bg-danger').addClass('bg-secondary');

        // 使用 jQuery AJAX 讀取 JSON 資料
        $.ajax({
          url: jsonUrl,
          type: 'GET',
          dataType: 'json',
          cache: false,
          success: function (data) {
            $('#loading-spinner').hide();

            if (!Array.isArray(data) || data.length === 0) {
              $('#error-message').text('查無此股票之歷史資料或資料格式不符。');
              $('#error-alert').removeClass('d-none');
              $('#data-count-badge').text('資料筆數：0 筆');
              return;
            }

            // 更新筆數徽章
            $('#data-count-badge')
              .text('總資料筆數：' + data.length.toLocaleString() + ' 筆')
              .removeClass('bg-secondary bg-danger')
              .addClass('bg-success');

            // 組合表格內容
            var rowsHtml = '';
            $.each(data, function (index, item) {
              // 支援 high 或 hight 屬性
              var highVal = item.hight !== undefined ? item.hight : (item.high !== undefined ? item.high : '-');
              var openVal = item.open !== undefined ? item.open : '-';
              var lowVal = item.low !== undefined ? item.low : '-';
              var closeVal = item.close !== undefined ? item.close : '-';
              var timeVal = item.time || '-';

              // 格式化數值（若是數字保留兩位至四位小數，若為字串則直接顯示）
              function formatNum(val) {
                if (typeof val === 'number') {
                  return val.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 4 });
                }
                return val;
              }

              rowsHtml += '<tr>' +
                '<td class="text-center fw-semibold text-muted">' + (index + 1) + '</td>' +
                '<td class="text-center font-monospace">' + timeVal + '</td>' +
                '<td class="text-end">' + formatNum(openVal) + '</td>' +
                '<td class="text-end text-danger">' + formatNum(highVal) + '</td>' +
                '<td class="text-end text-success">' + formatNum(lowVal) + '</td>' +
                '<td class="text-end fw-bold">' + formatNum(closeVal) + '</td>' +
                '</tr>';
            });

            // 渲染至 tbody 並顯示表格
            $('#stock-data-tbody').html(rowsHtml);
            $('#table-wrapper').fadeIn(200);
          },
          error: function (xhr, status, error) {
            $('#loading-spinner').hide();
            $('#error-message').text('讀取檔案失敗 (' + jsonUrl + ')：' + (error || status || '請確認本地伺服器或檔案路徑'));
            $('#error-alert').removeClass('d-none');
            $('#data-count-badge')
              .text('載入失敗')
              .removeClass('bg-secondary bg-success')
              .addClass('bg-danger');
          }
        });
      }

      // 表單送出事件 (Submit Button 觸發)
      $('#stock-form').on('submit', function (e) {
        e.preventDefault();
        var selectedStock = $('#stock-select').val();
        loadStockData(selectedStock);
      });

      // 選擇改變時亦可自動更新 (若使用者切換下拉選單)
      $('#stock-select').on('change', function () {
        var selectedStock = $(this).val();
        loadStockData(selectedStock);
      });

      // 初始預設載入 0050
      loadStockData($('#stock-select').val());
    });
  </script>
</body>
</html>
